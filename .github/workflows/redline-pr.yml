name: Redline changed Word documents

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/redline-pr.yml'
      - 'scripts/verify_results.py'
      - 'constraints.txt'

permissions:
  contents: read

jobs:
  redline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed DOCX files and compare PR base to head
        id: redline
        uses: JSv4/Python-Redlines@a84be23f0e3d333572a5b5a5d6db2205ae2cb5cf
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        with:
          files: 'contracts/**/*.docx'
          engine: docxodus
          package-version: '==1.0.0'
          docx2html-version: '12.1.0'
          detect-moves: 'true'
          html-preview: 'true'
          author: Demo Reviewer
          upload-artifact: 'false'

      - name: Verify the generated artifacts
        env:
          COUNT: ${{ steps.redline.outputs.count }}
          REDLINES: ${{ steps.redline.outputs.redlines }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$PR_BRANCH" = 'demo/nvca-negotiation' ]; then
            python3 scripts/verify_results.py --demo
          else
            python3 scripts/verify_results.py
          fi

      - name: Upload verified redlines for browser publishing
        if: steps.redline.outputs.count != '0'
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvca-pr-redlines
          path: redlines/
          retention-days: 90
          if-no-files-found: error

      - name: Link browser review
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "An inline preview and browser link will appear in this PR after the publishing workflow completes." >> "$GITHUB_STEP_SUMMARY"
          echo "[Browser previews](https://jsv4.github.io/docxodus-action-demo/) · [Download files](${ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"
