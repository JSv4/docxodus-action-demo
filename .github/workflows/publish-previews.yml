name: Word document review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  review:
    uses: JSv4/docx-actions/.github/workflows/review.yml@v2.1.1
    with:
      image-host: branch
