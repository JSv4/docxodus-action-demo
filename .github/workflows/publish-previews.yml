name: Word document review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request to compare; the sample contract is PR 1.
        type: number
        default: 1
      publish:
        description: Publish browser views and update PR comments.
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  review:
    uses: JSv4/docx-actions/.github/workflows/review.yml@8ee6e587cba9f30f87b68faa9745ce143c4b189d
    with:
      pull-request: ${{ github.event_name == 'workflow_dispatch' && inputs.pull-request || 0 }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
