name: Word document review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  review:
    uses: JSv4/docx-actions/.github/workflows/review.yml@27be20aff63e9d3a6ea0ab3f5a82173814bad0bb
    with:
      image-host: branch
