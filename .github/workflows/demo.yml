name: NVCA comparison demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify reproducible document fixtures
        run: |
          python -m pip install lxml==6.0.2
          python scripts/build_fixture.py --check

      - name: Compare original and revised NVCA charter
        id: redline
        # Published action wrapper; the comparison engine is Docxodus.
        uses: JSv4/Python-Redlines@a84be23f0e3d333572a5b5a5d6db2205ae2cb5cf
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        with:
          original: documents/original.docx
          modified: documents/revised.docx
          engine: docxodus
          package-version: '==1.0.0'
          docx2html-version: '12.1.0'
          detect-moves: 'true'
          html-preview: 'true'
          author: Demo Reviewer
          output-dir: redlines
          # Upload after verification so the downloadable bundle includes the report.
          upload-artifact: 'false'

      - name: Verify native revisions and rendered previews
        env:
          COUNT: ${{ steps.redline.outputs.count }}
          REDLINES: ${{ steps.redline.outputs.redlines }}
        run: python scripts/verify_results.py --demo

      - name: Include inputs and edit manifest in the review bundle
        run: |
          cp documents/original.docx documents/revised.docx documents/changes.json redlines/
          cp documents/SOURCE.md redlines/

      - name: Upload review bundle
        id: bundle
        uses: actions/upload-artifact@v7
        with:
          name: nvca-comparison-demo
          path: redlines/
          if-no-files-found: error
          retention-days: 90

      - name: Link downloadable results
        env:
          ARTIFACT_URL: ${{ steps.bundle.outputs.artifact-url }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the NVCA review bundle](${ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "Includes both inputs, the tracked-changes DOCX, HTML preview, edit manifest, and verification report." >> "$GITHUB_STEP_SUMMARY"
