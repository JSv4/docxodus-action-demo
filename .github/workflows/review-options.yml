name: Try review options

on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request to render (no document paths needed)
        type: number
        default: 1
        required: true
      mode:
        description: Document view
        type: choice
        options: [redline, latest, both]
        default: redline
      pages:
        description: Publish the full interactive viewer
        type: boolean
        default: false
      image-host:
        description: Where to host inline screenshot excerpts
        type: choice
        options: [branch, auto, none]
        default: branch
      comments:
        description: Update the PR comment
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  review:
    uses: JSv4/docx-actions/.github/workflows/review.yml@v2.1.0
    with:
      pull-request: ${{ fromJSON(format('{0}', inputs.pull-request)) }}
      mode: ${{ inputs.mode }}
      image-host: ${{ inputs.image-host }}
      pages: ${{ fromJSON(format('{0}', inputs.pages)) }}
      comments: ${{ fromJSON(format('{0}', inputs.comments)) }}
